name: Cloudflare CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy-client:
    name: Deploy Client (Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
            cd shared && npm install
            cd ../client && npm install

      - name: Build Client
        run: |
            cd shared && npm run build || true
            cd ../client && npm run build
        env:
          VITE_API_URL: https://etrio-api.miguelp001.workers.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=etrio-web

  deploy-server:
    name: Deploy Server (Workers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
            cd shared && npm install
            cd ../server && npm install

      - name: Build Server
        run: |
            cd server && npm run build
        env:
          DATABASE_URL: "file:./dev.db" # Placeholder for generation

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
